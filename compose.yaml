services:
  app:
    build:
      context: .
    image: musiq-app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./
          target: /app
          ignore:
            - node_modules
        - action: rebuild
          path: Dockerfile
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: thamangrg
    ports:
      - "5432:5432"